name: Compare the original and final list-shaped SDK actions
on:
  push:
    branches: [qualification/sdk-action-list-projection]
permissions:
  contents: read
  actions: read
jobs:
  runner:
    if: github.repository == 'tamird/rules_go' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE: f9689452ce5999237c187346ea2ad62207015d99
      PRIOR: 6b4da63029e77fc08377ef9b7e0181fec5c7aad5
      SOURCE: 1e46f02a9c4862f8d303bd18bcb6dd2da9230a4f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the source and original fixture
        id: sources
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE" && "$(git rev-parse HEAD^)" == "$BASE" ]]
          [[ "$(git rev-parse HEAD:tests/integration/go_bin_runner/go_bin_runner_test.go)" == 4cf6c3051a48e687c39aaf12943f28be37f8483e ]]
          git diff --quiet HEAD --
          [[ "$(uname -m)" == x86_64 && "$(bazel --version)" == 'bazel 9.3.1' ]]
          mkdir "$RUNNER_TEMP/runner-evidence"
      - name: Verify original final-source test receipt without rerunning the owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path
          repo = "repos/tamird/rules_go/actions"
          get = lambda path: subprocess.check_output(["gh", "api", repo + path])
          original, = json.loads(get("/runs/41656196227/artifacts"))["artifacts"]
          digest = "9a115fea0e96bcf85aa5f8c157297e92c715ab9a0015b3bd104ad8effe9a4da3"
          assert original["id"] == 13239628082 and original["digest"] == "sha256:" + digest
          raw = get("/artifacts/13239628082/zip")
          assert hashlib.sha256(raw).hexdigest() == digest
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              verdict = json.loads(z.read("fixed.verdict"))
              finished = z.read("fixed.finished").decode().strip()
          assert verdict["source"] == os.environ["SOURCE"] and verdict["status"] == "PASS"
          row = verdict["owner"]
          assert row["id"]["label"].endswith("//tests/integration/go_bin_runner:go_bin_runner_test")
          assert row["status"] == "PASSED" and not row["localCache"] and not row["remoteCache"]
          assert set(verdict["cases"]) == {"TestGoEnv","TestGoVersionFromScript","TestNoGoInExec","TestGoOnActionPath","TestGoActionExitStatus"}
          record = dict(run=41656196227, artifact=13239628082, digest=digest, ownerFinished=finished, original=verdict)
          Path(os.environ["RUNNER_TEMP"], "runner-evidence", "original.json").write_text(json.dumps(record))
          PY
      - name: Compare the configured action of a list caller
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PRIOR" --depth=1
          src=go/private/go_toolchain.bzl
          q=sdk_list_projection
          mkdir "$q"
          trap 'git restore --source="$SOURCE" -- "$src"; rm -r "$q"' EXIT
          cp go/tools/builders/flags.go "$q/input.go"
          cat > "$q/BUILD.bazel" <<'EOF'
          load(":probe.bzl", "probe")
          probe(name = "imports", src = "input.go", tool = "//go/tools/builders:md5sum")
          EOF
          cat > "$q/probe.bzl" <<'EOF'
          load("//go:def.bzl", "go_run_with_sdk")
          def _impl(ctx):
              src = ctx.file.src
              sdk = ctx.toolchains[Label("//go:toolchain")].sdk
              out = ctx.actions.declare_file("formatted.go")
              go_run_with_sdk(
                  ctx,
                  executable = ctx.attr.tool[DefaultInfo].files_to_run,
                  inputs = [src],
                  arguments = [src.path],
                  stdout = out,
                  tools = [depset([sdk.go], transitive = [sdk.srcs, sdk.headers, sdk.tools])],
                  env = {"GOROOT": sdk.root_file.dirname, "CGO_ENABLED": "0"},
                  mnemonic = "SdkListCaller",
              )
              return [DefaultInfo(files = depset([out]))]
          probe = rule(
              implementation = _impl,
              attrs = {"src": attr.label(allow_single_file = True), "tool": attr.label(executable = True, cfg = "exec")},
              toolchains = ["//go:toolchain"],
          )
          EOF
          for rev in "$PRIOR" "$SOURCE"; do
            git restore --source="$rev" -- "$src"
            bazel aquery --output=jsonproto --include_commandline --include_artifacts 'mnemonic("SdkListCaller", //sdk_list_projection:imports)' > "$RUNNER_TEMP/$rev.aquery"
          done
          date -u --iso-8601=ns > "$RUNNER_TEMP/lists.finished"
          python3 - <<'PYDATA'
          import datetime, json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          def project(rev):
              data = json.loads((temp / (rev + ".aquery")).read_text())
              a, = data["actions"]
              fragments = {v["id"]: v for v in data["pathFragments"]}
              def path(fragment):
                  row = fragments[fragment]
                  return path(row["parentId"]) + "/" + row["label"] if row.get("parentId") else row["label"]
              output, = [path(v["pathFragmentId"]) for v in data["artifacts"] if v["id"] in a["outputIds"]]
              argv = a["arguments"]
              assert a["mnemonic"] == "SdkListCaller" and len(a["actionKey"]) >= 32 and len(argv) == 7
              assert argv[1] == "runwithsdk" and argv[4] == output and argv[5].endswith("/md5sum") and argv[6] == "sdk_list_projection/input.go"
              return dict(argv=argv, key=a["actionKey"], output=output, env=a["environmentVariables"], platform=a["executionPlatform"])
          prior, final = (project(os.environ[k]) for k in ("PRIOR", "SOURCE"))
          assert prior == final
          (temp / "runner-evidence" / "lists.json").write_text(json.dumps(dict(prior=os.environ["PRIOR"], final=os.environ["SOURCE"], action=final, scope="analysis-only md5sum", lastAquery=(temp / "lists.finished").read_text().strip(), verified=datetime.datetime.now(datetime.timezone.utc).isoformat())))
          print(final)
          PYDATA
      - name: Validate original test reports before upload
        id: safe
        if: always() && steps.sources.outcome == 'success'
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP'], 'runner-evidence')
          allowed = {'original.json', 'lists.json'}
          assert any(p.iterdir())
          for path in p.iterdir():
              assert path.name in allowed and path.is_file() and not path.is_symlink()
              assert not re.search(rb'(?i)authorization\s*:|x-buildbuddy-api-key|bearer\s+[A-Za-z0-9_.-]{12,}', path.read_bytes())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.safe.outcome == 'success'
        with:
          name: sdk-action-path
          path: ${{ runner.temp }}/runner-evidence
          if-no-files-found: error
